name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import FastAPI app
        run: python -c "from app.main import app; print(app.title)"

      - name: Lint with flake8
        run: |
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        id: pytest
        continue-on-error: true
        run: |
          pytest -q --tb=short --disable-warnings > pytest-results.txt 2>&1

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.txt
          if-no-files-found: error

      - name: Fail when pytest fails
        if: steps.pytest.outcome == 'failure'
        run: |
          cat pytest-results.txt
          exit 1
